<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DGAMES STORE</title><meta name="theme-color" content="#fff8ee"><script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Unbounded:wght@600;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060409;--ink:#f4f3fa;--mute:#9a98b3;--line:rgba(255,255,255,.09);--glass:rgba(255,255,255,.045);--v:#8b4dff;--c:#f2c14e;--w:#f2c14e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body.nogl{background:radial-gradient(60vmax at 20% 0,#2a0f5e,transparent),radial-gradient(50vmax at 90% 100%,#4d3a0c,transparent),var(--bg)}
h1,h2,h3,.logo,.now{font-family:'Unbounded','Manrope',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
#gl,.shade{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shade{background:radial-gradient(ellipse at 50% -10%,transparent,rgba(7,7,13,.5)),linear-gradient(rgba(7,7,13,.25),rgba(7,7,13,.75))}
.tick,header,.sbar,main,footer{position:relative;z-index:2}
.tick{background:linear-gradient(90deg,#2a0f5e,#4d3a0c);overflow:hidden;font-weight:700;font-size:13px;height:36px;display:flex;align-items:center}
.tt{display:flex;width:max-content;animation:mq 32s linear infinite;white-space:nowrap}
.tt span{padding-right:56px}.tt em{font-style:normal;color:var(--w)}
@keyframes mq{to{transform:translateX(-50%)}}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;margin-top:10px}
.hd{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:22px;background:rgba(14,14,26,.62);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.logo{font-weight:800;font-size:15px;display:flex;align-items:center;gap:11px;flex:1;text-decoration:none}
.logo svg{width:32px;height:32px}
.srch{width:100%}.sbar{margin-top:12px}
.srch input,.inp{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:0 16px;font:inherit;color:var(--ink);transition:.25s}
textarea.inp{height:120px;padding:12px 16px;resize:none}
.srch input:focus,.inp:focus{outline:0;border-color:rgba(139,77,255,.85);background:rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(139,77,255,.18)}
.ib{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center;transition:.25s}
.ib:hover{background:rgba(255,255,255,.12)}
.ib b{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:99px;background:var(--c);color:#1a1000;font-size:12px;display:grid;place-items:center;padding:0 5px}
.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.5)}}
@media(min-width:760px){.logo{flex:none}.hd .sp{flex:1}}
.sp{display:none}@media(min-width:760px){.sp{display:block}}
.enter .spot,.enter .card,.enter .sh,.enter .panel,.enter .ci{animation:rise .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}}
.spot{position:relative;height:clamp(340px,42vw,440px);border-radius:28px;overflow:hidden;margin-top:20px;border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.55)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide>svg{position:absolute;left:-4%;top:-4%;width:108%;height:108%;transform:translate(var(--px,0),var(--py,0));transition:transform .5s ease-out}
.slide.on>svg{animation:kb 10s ease-out forwards}
@keyframes kb{from{scale:1.14}to{scale:1}}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,7,13,.9),rgba(7,7,13,.3) 60%,transparent),linear-gradient(0deg,rgba(7,7,13,.7),transparent 55%)}
.sc{position:absolute;left:clamp(20px,5vw,56px);bottom:clamp(54px,6vw,56px);max-width:min(560px,86%)}
.sc>*{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.slide.on .sc>*{opacity:1;transform:none}
.slide.on .sc>:nth-child(2){transition-delay:.12s}.slide.on .sc>:nth-child(3){transition-delay:.22s}.slide.on .sc>:nth-child(4){transition-delay:.32s}
.tag{display:inline-block;background:rgba(242,193,78,.16);color:var(--w);border:1px solid rgba(242,193,78,.4);font-weight:700;font-size:12px;padding:4px 12px;border-radius:99px;margin-bottom:12px}
.sc h2{font-size:clamp(26px,5vw,52px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.sc p{color:#cfcde0;margin:10px 0 18px}
.acts{display:flex;gap:10px}
.buy{background:linear-gradient(135deg,#f6d37a,#e0a92e);color:#1a1000;font-weight:800;border-radius:14px;padding:13px 22px;transition:.25s}
.buy:hover{background:linear-gradient(135deg,#9d63ff,#6d28d9);color:#fff;transform:translateY(-2px)}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(7,7,13,.5);border:1px solid var(--line);font-size:24px;z-index:3;transition:.25s}
.arr:hover{background:rgba(255,255,255,.2)}.arr.l{left:14px}.arr.r{right:14px}
.dots{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.dot{width:30px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.dot.on::after{content:"";position:absolute;inset:0;background:var(--c);transform-origin:left;animation:fill 5.5s linear forwards}
@keyframes fill{from{transform:scaleX(0)}}
.sec{margin-top:40px}
.sh,.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sh h2,.head h1{font-size:clamp(20px,3.2vw,28px);font-weight:800;letter-spacing:-.02em}
.sh a{color:var(--mute);text-decoration:none;font-weight:700;font-size:14px}.sh a:hover{color:#fff}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 min(230px,62vw);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;padding-bottom:20px}
.card{position:relative;border-radius:22px;background:var(--glass);border:1px solid var(--line);overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .4s}
.card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.25);box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 50px rgba(139,77,255,.22)}
.art{aspect-ratio:4/5;position:relative;overflow:hidden}
.art svg{display:block;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover .art svg{transform:scale(1.1)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,7,13,.85),transparent 60%);pointer-events:none}
.nm{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;font:800 17px/1.15 'Unbounded';text-shadow:0 2px 14px rgba(0,0,0,.6)}
.off{position:absolute;top:10px;left:10px;z-index:1;background:var(--w);color:#2a1600;font-weight:800;font-size:12px;padding:4px 10px;border-radius:10px}
.hbtn{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:12px;background:rgba(7,7,13,.55);border:1px solid var(--line);display:grid;place-items:center;transition:.25s}
.hbtn.big{position:static;width:48px;height:48px;border-radius:14px}
.hbtn:hover{transform:scale(1.1)}.hbtn.on{color:#ff5c8a}.hbtn.on svg{fill:currentColor}
.cb{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 14px}
.now{font-size:16px;font-weight:800}.was{color:var(--mute);text-decoration:line-through;font-size:12px;margin-left:8px}
.cbtn{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f6d37a,#e0a92e);color:#1a1000;display:grid;place-items:center;font-weight:800;transition:.25s}
.cbtn:hover{background:linear-gradient(135deg,#9d63ff,#6d28d9);color:#fff;transform:translateY(-2px)}
.cbtn.on{background:rgba(88,230,161,.16);color:#58e6a1}
.own{font-weight:800}.ready{color:#58e6a1;font-size:12px;font-weight:700}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:13px;font-weight:600;transition:.25s}
.chip:hover{background:rgba(255,255,255,.1)}.chip[aria-pressed="true"]{background:linear-gradient(135deg,#f6d37a,#e0a92e);color:#1a1000;border-color:transparent}
select.chip{appearance:none;color:var(--ink)}select.chip option{background:#12121f}
.empty{text-align:center;color:var(--mute);padding:70px 0}.empty .buy{display:inline-block;margin-top:18px;text-decoration:none}
.cart{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
@media(max-width:860px){.cart{grid-template-columns:1fr}}
.ci{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);margin-bottom:12px}
.cth{width:70px;height:90px;border-radius:12px;overflow:hidden;flex:none}.cth svg{width:100%;height:100%;display:block}
.cinfo{flex:1;min-width:0}.cinfo h3{font-size:14px;margin-bottom:2px}.cinfo .pr{color:var(--mute);font-weight:700;margin-bottom:10px}
.qt{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;margin-right:8px}
.qt button{width:34px;height:34px;font-size:18px}.qt span{min-width:26px;text-align:center;font-weight:700}
.rm{color:var(--mute);padding:6px;vertical-align:middle}.rm:hover{color:#ff5c8a}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-weight:600;margin:6px 0 20px}
.panel{padding:22px;border-radius:24px;background:var(--glass);border:1px solid var(--line)}
.panel h3{font-size:15px;margin-bottom:16px}
.prog{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:12px 0 16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--c));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.cp{display:flex;gap:8px;margin-bottom:18px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;color:var(--mute)}
.sr.t{color:var(--ink);font:800 19px 'Unbounded';padding-top:16px;border-top:1px solid var(--line);margin-top:8px}
.tg{background:rgba(88,230,161,.14);color:#58e6a1;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700}
.pay{width:100%;margin-top:18px;padding:15px;border-radius:14px;background:linear-gradient(135deg,#f6d37a,#e0a92e);color:#1a1000;font-weight:800;transition:.25s}
.pay:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(139,77,255,.5)}
.form{max-width:560px;display:grid;gap:12px}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:13px;margin-top:50px}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:44;opacity:0;pointer-events:none;transition:opacity .4s}
.bd.on{opacity:1;pointer-events:auto}
.nav{position:fixed;top:0;left:0;bottom:0;width:min(330px,86%);background:rgba(12,12,24,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--line);z-index:45;transform:translateX(-105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px}
.nav.on{transform:none}
.nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.nh h3{font-size:18px}
.nav a,.nav button.nl{display:flex;justify-content:space-between;width:100%;padding:17px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:700;font-size:16px;text-align:left;transition:.25s}
.nav a:hover,.nav button.nl:hover{padding-left:12px}.nav a.on{color:var(--c)}
.ok{position:fixed;inset:0;z-index:90;background:rgba(7,7,13,.9);backdrop-filter:blur(12px);display:none;place-items:center;text-align:center;padding:20px}
.ok.show{display:grid}.ok svg{width:110px;height:110px;margin-bottom:18px}
.ok circle{stroke-dasharray:214;stroke-dashoffset:214;animation:dr .7s .1s forwards}.ok path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .65s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ok h2{font-size:24px}.ok p{color:var(--mute);margin-top:8px}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#splash{animation:sOut .7s 2.2s forwards}@keyframes sOut{to{opacity:0;visibility:hidden}}
#splash.out{opacity:0;visibility:hidden}
.sl{display:grid;gap:26px;justify-items:center}.sl .logo{font-size:19px;flex:none;animation:pop 1s cubic-bezier(.2,.8,.2,1) backwards}.sl .logo svg{width:48px;height:48px}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.pb{width:min(260px,60vw);height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--c));transform-origin:left;animation:ld 1.4s ease-out forwards}
@keyframes ld{from{transform:scaleX(0)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:rgba(20,20,36,.94);border:1px solid var(--line);backdrop-filter:blur(14px);padding:12px 22px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.35s;z-index:80;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;width:46px;height:46px;border-radius:14px;z-index:70;pointer-events:none;box-shadow:0 0 30px rgba(139,77,255,.7)}
.logo{white-space:nowrap;min-width:0}@media(max-width:600px){.wrap{padding:0 14px}.hd{gap:8px;padding:8px 8px 8px 12px}.hd .logo{font-size:clamp(10px,3.5vw,14px);gap:8px}.hd .logo svg{width:28px;height:28px}.ib{width:40px;height:40px}.ib b{top:-7px;right:-7px;min-width:20px;height:20px}}
.cb{flex-direction:column;align-items:stretch;gap:10px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pr small{display:block;color:var(--mute);font-size:11px;font-weight:600;line-height:1.2}
.pr .now{font-size:15px}.pr2{color:var(--mute);font-weight:700;margin-bottom:10px}
.nm{font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
a.chip{text-decoration:none;color:var(--ink);display:inline-block}
.tabs{margin-bottom:20px}.cnt{font:600 13px 'Manrope';color:var(--mute);margin-left:10px;letter-spacing:0}
.soon{text-align:center;padding:48px 20px;position:relative;overflow:hidden}
.soon::before{content:"";position:absolute;left:-50%;top:-150%;width:200%;height:400%;background:conic-gradient(transparent,rgba(242,193,78,.35),transparent 30%,rgba(139,77,255,.35),transparent 60%);animation:rot 9s linear infinite}
.soon::after{content:"";position:absolute;inset:1px;border-radius:inherit;background:rgba(10,7,18,.94)}
.soon>*{position:relative;z-index:1}.soon h2{font-size:clamp(22px,4vw,32px);margin-bottom:10px}.soon p{color:var(--mute);max-width:44ch;margin:0 auto 22px}
@keyframes rot{to{transform:rotate(360deg)}}
.cs{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(242,193,78,.45);color:var(--c);border-radius:99px;padding:5px 14px;font-weight:700;font-size:13px;margin-bottom:16px}
.cs::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3;transform:scale(1.6)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== pro polish + scroll fx ===== */
:root{--e:cubic-bezier(.16,1,.3,1);--c:#e8b84a;--w:#e8b84a}
h1,h2{font-weight:600}
.tick{background:#0d0a16;border-bottom:1px solid var(--line);color:#cfcde0}
.tt span::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.35);margin-left:56px;vertical-align:middle}
header{transition:translate .5s var(--e)}header.hide{translate:0 -170%}
.hd{border-radius:18px;background:rgba(12,10,20,.74);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.sec{margin-top:60px}
.buy,.cbtn,.pay,.chip[aria-pressed="true"]{background:var(--c);color:#17110a}
.buy:hover,.cbtn:hover{background:#fff;color:#17110a;transform:translateY(-2px)}
.pay:hover{box-shadow:0 12px 30px rgba(232,184,74,.28)}
.prog i,#pg{background:linear-gradient(90deg,var(--v),var(--c))}
.spot{border-radius:24px;transform-origin:50% 0;transform:translateY(calc(var(--sp,0)*30px)) scale(calc(1 - var(--sp,0)*.07))}
.sc{translate:0 calc(var(--sp,0)*-50px);opacity:calc(1 - var(--sp,0)*1.3)}
.slide>svg{translate:0 calc(var(--sp,0)*14px)}
.sc h2{font-weight:700;letter-spacing:-.03em}
.card{border-radius:18px;background:rgba(255,255,255,.035)}
.card:hover{border-color:rgba(255,255,255,.22);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0),rgba(255,255,255,.12),transparent 60%)}
.card:hover::after{opacity:1}
.nm{font:800 15px/1.2 'Manrope',system-ui,sans-serif;letter-spacing:-.01em}
.off{background:rgba(7,7,13,.72);color:var(--ink);border:1px solid rgba(255,255,255,.18)}
#pg{position:fixed;top:0;left:0;right:0;height:3px;z-index:95;transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.enter .spot,.enter .card,.enter .sh,.enter .panel,.enter .ci{animation:none}
footer{padding:34px 0}
.fw{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:flex-start}
.fw b{display:block;color:var(--ink);font:800 14px 'Unbounded';margin-bottom:6px}
.fl{display:flex;gap:22px}.fl a{text-decoration:none}.fl a:hover{color:#fff}
.fc{width:100%;padding-top:18px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){
.rv{opacity:0;translate:0 56px;scale:.94;rotate:var(--r,0deg);transition:opacity .9s var(--e) calc(var(--d,0)*70ms),translate 1s var(--e) calc(var(--d,0)*70ms),scale 1s var(--e) calc(var(--d,0)*70ms),rotate 1s var(--e) calc(var(--d,0)*70ms)}
.rv.in{opacity:1;translate:0 0;scale:1;rotate:0deg}
.card.rv{transition:opacity .9s var(--e) calc(var(--d,0)*70ms),translate 1s var(--e) calc(var(--d,0)*70ms),scale 1s var(--e) calc(var(--d,0)*70ms),rotate 1s var(--e) calc(var(--d,0)*70ms),transform .35s var(--e),border-color .3s,box-shadow .4s}
.spot.rv{clip-path:inset(10% 8% 10% 8% round 36px);translate:0 0;scale:.94;transition:opacity 1s var(--e),scale 1.2s var(--e),clip-path 1.3s var(--e)}
.spot.rv.in{clip-path:inset(0 round 24px)}
.sh.rv h2,.head.rv h1{clip-path:inset(-10% 100% -10% -2%);transition:clip-path 1.1s var(--e) .1s}
.sh.in h2,.head.in h1{clip-path:inset(-10% -2% -10% -2%)}
.sh.rv,.head.rv{translate:0 24px;scale:1}
}

/* ===== red arcade theme ===== */

/* scroll fx: transform/opacity only, one rAF-throttled scroll handler, IntersectionObserver reveals */
let hh=500,io=null,y0=0,ticking=0,fxT=0;
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches,fine=matchMedia('(hover:hover) and (pointer:fine)').matches,pg=document.createElement('div');
pg.id='pg';document.body.appendChild(pg);
function upd(){ticking=0;const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
  pg.style.transform='scaleX('+(h>0?Math.min(y/h,1):0).toFixed(4)+')';
  const sp=$('#spot');if(sp&&!calm)sp.style.setProperty('--sp',Math.min(Math.max(y/(hh+120),0),1).toFixed(3));
  const d=y-y0;if(Math.abs(d)>4){$('header').classList.toggle('hide',d>0&&y>260);y0=y}}
addEventListener('scroll',()=>{if(!ticking){ticking=1;requestAnimationFrame(upd)}},{passive:true});
addEventListener('resize',()=>{const s=$('#spot');if(s)hh=s.offsetHeight});
function fx(anim){
  if(io)io.disconnect();const tk=++fxT,v=$('#view'),sp=$('#spot');if(sp)hh=sp.offsetHeight;
  if(!anim||calm||!('IntersectionObserver' in window))return;
  const els=[...v.querySelectorAll('.spot,.sh,.head,.tabs,.tools,.stat,.strip,.card,.panel,.ci,.empty,.back')],n=new Map;
  els.forEach(e=>{e.classList.add('rv');if(e.classList.contains('card')){const p=e.parentNode,i=n.get(p)||0;n.set(p,i+1);e.style.setProperty('--d',i%5);e.style.setProperty('--r',(i%2?-3:3)+'deg')}});
  const go=()=>{if(tk!==fxT)return;io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1,rootMargin:'0px 0px -6% 0px'});els.forEach(e=>io.observe(e))};
  $('#splash')?setTimeout(go,1500):go();
}
if(fine&&!calm){const v=$('#view');
  v.addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',(x*100).toFixed(0)+'%');c.style.setProperty('--my',(y*100).toFixed(0)+'%');c.style.transform='perspective(800px) rotateX('+((.5-y)*8).toFixed(2)+'deg) rotateY('+((x-.5)*10).toFixed(2)+'deg) translateY(-6px)'});
  v.addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget))c.style.transform=''})}

/* WebGL flowing nebula background */
(function(){return;
  const cv=$('#gl'),gl=cv.getContext('webgl',{antialias:false,powerPreference:'low-power'});
  if(!gl){document.body.classList.add('nogl');return}
  const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 r;uniform float t;uniform vec2 m;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
void main(){
  vec2 uv=gl_FragCoord.xy/r.y;float T=t*.06;vec2 p=uv*1.3;
  vec2 q=vec2(fbm(p+vec2(0.,T)),fbm(p+vec2(5.2,1.3)-T));
  vec2 w=vec2(fbm(p+2.2*q+vec2(1.7,9.2)+T*.7),fbm(p+2.2*q+vec2(8.3,2.8)-T*.5));
  float f=fbm(p+2.4*w+(m-.5)*.8);
  vec3 col=vec3(.02,.012,.035);
  col=mix(col,vec3(.34,.12,.72),smoothstep(.25,.85,f)*.75);
  col=mix(col,vec3(.75,.55,.14),smoothstep(.4,1.,length(q))*.26);
  col+=vec3(.6,.2,.9)*pow(w.x,3.)*.35;
  float v=smoothstep(1.4,.2,length(gl_FragCoord.xy/r-.5)*1.3);
  col*=.55+.45*v;
  gl_FragColor=vec4(col,1.);
}`;
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){document.body.classList.add('nogl');return}
  gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  const ur=gl.getUniformLocation(pr,'r'),ut=gl.getUniformLocation(pr,'t'),um=gl.getUniformLocation(pr,'m');
  function size(){cv.width=Math.max(2,innerWidth*.42|0);cv.height=Math.max(2,innerHeight*.42|0);gl.viewport(0,0,cv.width,cv.height)}
  addEventListener('resize',size);size();
  let tx=.5,ty=.5,mx=.5,my=.5;addEventListener('pointermove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight});
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let last=0;function frame(now){if(!still)requestAnimationFrame(frame);if(now-last<33)return;last=now;mx+=(tx-mx)*.04;my+=(ty-my)*.04;gl.uniform2f(ur,cv.width,cv.height);gl.uniform1f(ut,still?20:now/1000);gl.uniform2f(um,mx,my);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
  requestAnimationFrame(frame);
})();
